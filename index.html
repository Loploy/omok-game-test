<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오목 모드 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  :root{
    --paper: #f7f5ef;
    --rule: #d7d9e6;
    --ink: #2c3968;
    --ink-soft: #5b699a;
    --accent: #b23b3b;
    --text: #23252b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #e9e6de;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }
  h1 {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 52px;
    margin: 0;
    color: var(--ink);
    line-height: 1;
  }
  .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 6px 0 24px;
  }
  .modes {
    display: grid;
    gap: 14px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background:
      repeating-linear-gradient(
        to bottom,
        var(--paper) 0px, var(--paper) 27px,
        var(--rule) 27px, var(--rule) 28px
      );
    border-radius: 4px;
    box-shadow: 0 12px 30px rgba(30,25,10,0.18), 0 1px 0 rgba(255,255,255,0.6) inset;
    padding: 18px 20px;
    border: none;
    text-align: left;
    width: 100%;
    font-family: inherit;
    cursor: pointer;
  }
  .card:active { transform: translateY(1px); }
  .card-title {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 30px;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .card.soon {
    cursor: default;
    opacity: 0.55;
    box-shadow: 0 4px 12px rgba(30,25,10,0.10);
    pointer-events: none;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>오목</h1>
    <p class="sub">모드를 골라 시작</p>
    <div class="modes" id="modes"></div>
  </div>

<script>
(function () {

  const MODES = [
    {
      name: 'Wave Omok',
      desc: '판이 삐뚤빼뚤하게 그려짐. 논리적으로는 5목이어도 눈으로는 잘 안 보임',
      href: 'modes/wave/wave-omok.html',
    },
    {
      name: '스킬 오목',
      desc: '게임당 1회 쓰는 소모성 스킬. 줄 추가, 상대 스턴 등',
      href: null,
    },
    {
      name: '체력전',
      desc: '5목 대신 HP를 깎는 방식. 공격 판정과 콤보 데미지',
      href: null,
    },
  ];

  const container = document.getElementById('modes');

  for (const mode of MODES) {

    const card = document.createElement(mode.href ? 'a' : 'div');
    card.className = mode.href ? 'card' : 'card soon';
    if (mode.href) card.href = mode.href;

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = mode.name;
    if (!mode.href) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '준비 중';
      title.appendChild(badge);
    }

    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = mode.desc;

    card.appendChild(title);
    card.appendChild(desc);
    container.appendChild(card);
  }
})();
</script>
</body>
</html>
